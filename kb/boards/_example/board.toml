# Template. Copy to kb/boards/<id>/board.toml and fill from a real schematic.
# Search uses these fields. Empty means unknown — do not invent values.

id = "example-board"
soc = "imx6ul"
goarch = "arm"
goarm = "7"

ram_start = "0x80000000"
ram_size = "0x20000000"
uart = "UART2"

peripherals = ["uart", "gpio", "usb", "usdhc"]

tamago_soc = "github.com/usbarmory/tamago/soc/nxp/imx6ul"
tamago_board = "github.com/usbarmory/tamago/board/usbarmory/mk2"

schematic = "schematic.pdf"
tree = "tree"

notes = "Nearest real board this example is pretending to be. Replace."

# Optional pinmux rows. Prefer a table over notes.
# [[pinmux]]
# signal = "UART2_TX"
# pad = "CSI_DATA00"
# fn = "ALT3"
