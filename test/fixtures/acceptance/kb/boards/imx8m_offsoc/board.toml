id = "imx8m_offsoc"
soc = "imx8m"
goarch = "arm64"
goarm = ""
ram_start = "0x40000000"
ram_size = "0x80000000"
uart = "UART1"
peripherals = ["uart", "gpio", "pcie", "usb3"]
tamago_soc = "github.com/usbarmory/tamago/soc/nxp/imx8m"
tamago_board = "hatch.local/imx8m_offsoc"
tree = "tree"
notes = "Different SoC. Must never appear in an imx6ul result."

[[pinmux]]
signal = "UART1_TX"
pad = "UART1_TXD"
fn = "ALT0"

[[pinmux]]
signal = "UART1_RX"
pad = "UART1_RXD"
fn = "ALT0"
